<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="output.css">
  <title>Sistema de Votação - Linguagens de Programação</title>
</head>
<body class="bg-gray-950 min-h-screen">

<div class="flex min-h-screen">

  
  <div class="hidden lg:flex lg:w-1/2 relative items-center justify-center bg-gradient-to-t from-black to-purple-900">
    
    
    <div class="relative z-10 w-full max-w-md px-8">
      <div class="text-center mb-10">
        <span class="text-5xl mb-4 block"></span>
        <h2 class="text-3xl font-bold text-white mb-2">Vote na sua linguagem</h2>
        <p class="text-gray-400">Escolha a linguagem de programação que você mais gostou na apresentação</p>
      </div>

      <!-- Opções de voto -->
      <div class="space-y-4" id="vote-options">

        <label class="vote-option group flex items-center gap-4 bg-white/5 border-2 border-white/10 rounded-xl p-4 cursor-pointer hover:border-indigo-500/50 hover:bg-white/10 transition-all duration-300">
          <input type="radio" name="linguagem" value="assembly" class="hidden peer" />
          <div class="w-12 h-12 rounded-xl bg-red-500/10 flex items-center justify-center text-2xl shrink-0 group-hover:scale-110 transition-transform">⚙️</div>
          <div class="flex-1">
            <h3 class="font-bold text-white">Assembly</h3>
            <p class="text-xs text-gray-500">Linguagem de baixo nível, próxima ao hardware</p>
          </div>
          <div class="w-6 h-6 rounded-full border-2 border-gray-600 flex items-center justify-center shrink-0 peer-checked:border-indigo-500 peer-checked:bg-indigo-500 transition-all">
            <svg class="w-3 h-3 text-white opacity-0 peer-checked:opacity-100" fill="currentColor" viewBox="0 0 20 20">
              <path d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-8 10.5a.75.75 0 0 1-1.127.075l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 0 1 1.05-.143Z" fill-rule="evenodd" clip-rule="evenodd"/>
            </svg>
          </div>
        </label>

        <label class="vote-option group flex items-center gap-4 bg-white/5 border-2 border-white/10 rounded-xl p-4 cursor-pointer hover:border-indigo-500/50 hover:bg-white/10 transition-all duration-300">
          <input type="radio" name="linguagem" value="cpp" class="hidden peer" />
          <div class="w-12 h-12 rounded-xl bg-blue-500/10 flex items-center justify-center text-2xl shrink-0 group-hover:scale-110 transition-transform">💠</div>
          <div class="flex-1">
            <h3 class="font-bold text-white">C++</h3>
            <p class="text-xs text-gray-500">Alto desempenho, orientada a objetos</p>
          </div>
          <div class="w-6 h-6 rounded-full border-2 border-gray-600 flex items-center justify-center shrink-0 peer-checked:border-indigo-500 peer-checked:bg-indigo-500 transition-all">
            <svg class="w-3 h-3 text-white opacity-0 peer-checked:opacity-100" fill="currentColor" viewBox="0 0 20 20">
              <path d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-8 10.5a.75.75 0 0 1-1.127.075l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 0 1 1.05-.143Z" fill-rule="evenodd" clip-rule="evenodd"/>
            </svg>
          </div>
        </label>

        <label class="vote-option group flex items-center gap-4 bg-white/5 border-2 border-white/10 rounded-xl p-4 cursor-pointer hover:border-indigo-500/50 hover:bg-white/10 transition-all duration-300">
          <input type="radio" name="linguagem" value="pascal" class="hidden peer" />
          <div class="w-12 h-12 rounded-xl bg-yellow-500/10 flex items-center justify-center text-2xl shrink-0 group-hover:scale-110 transition-transform">📐</div>
          <div class="flex-1">
            <h3 class="font-bold text-white">Pascal</h3>
            <p class="text-xs text-gray-500">Estruturada, ideal para aprendizado</p>
          </div>
          <div class="w-6 h-6 rounded-full border-2 border-gray-600 flex items-center justify-center shrink-0 peer-checked:border-indigo-500 peer-checked:bg-indigo-500 transition-all">
            <svg class="w-3 h-3 text-white opacity-0 peer-checked:opacity-100" fill="currentColor" viewBox="0 0 20 20">
              <path d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-8 10.5a.75.75 0 0 1-1.127.075l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 0 1 1.05-.143Z" fill-rule="evenodd" clip-rule="evenodd"/>
            </svg>
          </div>
        </label>

        <label class="vote-option group flex items-center gap-4 bg-white/5 border-2 border-white/10 rounded-xl p-4 cursor-pointer hover:border-indigo-500/50 hover:bg-white/10 transition-all duration-300">
          <input type="radio" name="linguagem" value="prolog" class="hidden peer" />
          <div class="w-12 h-12 rounded-xl bg-emerald-500/10 flex items-center justify-center text-2xl shrink-0 group-hover:scale-110 transition-transform">🧠</div>
          <div class="flex-1">
            <h3 class="font-bold text-white">Prolog</h3>
            <p class="text-xs text-gray-500">Lógica e inteligência artificial</p>
          </div>
          <div class="w-6 h-6 rounded-full border-2 border-gray-600 flex items-center justify-center shrink-0 peer-checked:border-indigo-500 peer-checked:bg-indigo-500 transition-all">
            <svg class="w-3 h-3 text-white opacity-0 peer-checked:opacity-100" fill="currentColor" viewBox="0 0 20 20">
              <path d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-8 10.5a.75.75 0 0 1-1.127.075l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 0 1 1.05-.143Z" fill-rule="evenodd" clip-rule="evenodd"/>
            </svg>
          </div>
        </label>

      </div>
    </div>
  </div>

  <!---- LADO DIREITO: -->
  <div class="flex w-full lg:w-1/2 flex-col justify-center px-6 py-12 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-sm">
      <div class="text-center">
        <span class="text-5xl mb-4 block"></span>
        <h2 class="mt-4 text-center text-2xl/9 font-bold tracking-tight text-white">Registre seu Voto</h2>
        <p class="mt-2 text-sm text-gray-400">Informe seus dados para validar a votação</p>
      </div>
    </div>

    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
      <form id="vote-form" class="space-y-6">

        
        <div class="lg:hidden">
          <label class="block text-sm/6 font-medium text-gray-100 mb-2">Linguagem favorita</label>
          <div class="space-y-3">
            <label class="flex items-center gap-3 bg-white/5 border border-white/10 rounded-lg p-3 cursor-pointer hover:border-indigo-500/50 transition-all">
              <input type="radio" name="linguagem" value="assembly" class="accent-indigo-500" />
              <span class="text-white text-sm">⚙️ Assembly</span>
            </label>
            <label class="flex items-center gap-3 bg-white/5 border border-white/10 rounded-lg p-3 cursor-pointer hover:border-indigo-500/50 transition-all">
              <input type="radio" name="linguagem" value="cpp" class="accent-indigo-500" />
              <span class="text-white text-sm">💠 C++</span>
            </label>
            <label class="flex items-center gap-3 bg-white/5 border border-white/10 rounded-lg p-3 cursor-pointer hover:border-indigo-500/50 transition-all">
              <input type="radio" name="linguagem" value="pascal" class="accent-indigo-500" />
              <span class="text-white text-sm">📐 Pascal</span>
            </label>
            <label class="flex items-center gap-3 bg-white/5 border border-white/10 rounded-lg p-3 cursor-pointer hover:border-indigo-500/50 transition-all">
              <input type="radio" name="linguagem" value="prolog" class="accent-indigo-500" />
              <span class="text-white text-sm">🧠 Prolog</span>
            </label>
          </div>
        </div>

        <div>
          <label for="nome" class="block text-sm/6 font-medium text-gray-100">Nome completo</label>
          <div class="mt-2">
            <input id="nome" type="text" name="nome" required placeholder="Digite seu nome" class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6" />
          </div>
        </div>

        <div>
          <label for="senha" class="block text-sm/6 font-medium text-gray-100">Senha simbólica</label>
          <p class="text-xs text-gray-500 mt-1">Uma senha para identificar seu voto</p>
          <div class="mt-2">
            <input id="senha" type="password" name="senha" required placeholder="Crie uma senha" class="block w-full rounded-md bg-white/5 px-3 py-1.5 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-500 sm:text-sm/6" />
          </div>
        </div>

        <div>
          <button type="submit" class="flex w-full justify-center rounded-md bg-indigo-500 px-3 py-1.5 text-sm/6 font-semibold text-white hover:bg-indigo-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500 transition-all active:scale-95">
            🗳️ Registrar Voto
          </button>
        </div>
      </form>

      
      <div id="success-msg" class="hidden mt-6 bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-4 text-center">
        <span class="text-3xl block mb-2">✅</span>
        <p class="text-emerald-400 font-semibold">Voto registrado com sucesso!</p>
        <p id="vote-summary" class="text-sm text-gray-400 mt-1"></p>
      </div>

      
      <div id="results" class="mt-10 hidden">
        <h3 class="text-sm font-semibold text-gray-400 uppercase tracking-wider mb-4">Resultado parcial</h3>
        <div class="space-y-3">
          <div>
            <div class="flex justify-between text-sm mb-1">
              <span class="text-gray-300">⚙️ Assembly</span>
              <span id="assembly-pct" class="text-gray-500">0%</span>
            </div>
            <div class="w-full bg-gray-800 rounded-full h-2">
              <div id="assembly-bar" class="bg-red-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
          </div>
          <div>
            <div class="flex justify-between text-sm mb-1">
              <span class="text-gray-300">💠 C++</span>
              <span id="cpp-pct" class="text-gray-500">0%</span>
            </div>
            <div class="w-full bg-gray-800 rounded-full h-2">
              <div id="cpp-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
          </div>
          <div>
            <div class="flex justify-between text-sm mb-1">
              <span class="text-gray-300">📐 Pascal</span>
              <span id="pascal-pct" class="text-gray-500">0%</span>
            </div>
            <div class="w-full bg-gray-800 rounded-full h-2">
              <div id="pascal-bar" class="bg-yellow-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
          </div>
          <div>
            <div class="flex justify-between text-sm mb-1">
              <span class="text-gray-300">🧠 Prolog</span>
              <span id="prolog-pct" class="text-gray-500">0%</span>
            </div>
            <div class="w-full bg-gray-800 rounded-full h-2">
              <div id="prolog-bar" class="bg-emerald-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
          </div>
        </div>
        <p id="total-votes" class="text-xs text-gray-600 text-center mt-4"></p>
      </div>
    </div>
  </div>

</div>

<script>
 // const API_URL = 'http://localhost:8080/api/votos'; https://votacaoapi-2.onrender.com
  const API_URL = 'https://votacaoapi-2.onrender.com/api/votos';

  async function updateResults() {
    try {
      const response = await fetch(API_URL + '/resultados');
      if (!response.ok) return;
      
      const data = await response.json();
      const total = data.assembly + data.cpp + data.pascal + data.prolog;

      if (total === 0) return;

      document.getElementById('results').classList.remove('hidden');

      const langs = ['assembly', 'cpp', 'pascal', 'prolog'];
      langs.forEach(lang => {
        const pct = Math.round((data[lang] / total) * 100);
        document.getElementById(lang + '-bar').style.width = pct + '%';
        document.getElementById(lang + '-pct').textContent = pct + '%';
      });

      document.getElementById('total-votes').textContent = 'Total de votos: ' + total;
    } catch (error) {
      console.error('Erro ao buscar resultados da API:', error);
    }
  }

  // Destaque visual ao selecionar (lado esquerdo)
  document.querySelectorAll('.vote-option').forEach(label => {
    const input = label.querySelector('input[type="radio"]');
    input.addEventListener('change', () => {
      document.querySelectorAll('.vote-option').forEach(l => {
        l.classList.remove('border-indigo-500', 'bg-indigo-500/10');
        l.classList.add('border-white/10', 'bg-white/5');
        l.querySelector('.w-6').classList.remove('border-indigo-500', 'bg-indigo-500');
        l.querySelector('.w-6').classList.add('border-gray-600');
        l.querySelector('svg').classList.add('opacity-0');
      });
      label.classList.remove('border-white/10', 'bg-white/5');
      label.classList.add('border-indigo-500', 'bg-indigo-500/10');
      label.querySelector('.w-6').classList.remove('border-gray-600');
      label.querySelector('.w-6').classList.add('border-indigo-500', 'bg-indigo-500');
      label.querySelector('svg').classList.remove('opacity-0');
    });
  });

  // Submit do formulário
  document.getElementById('vote-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const nome = document.getElementById('nome').value.trim();
    const senha = document.getElementById('senha').value.trim();
    const linguagem = document.querySelector('input[name="linguagem"]:checked');

    if (!nome || !senha) {
      alert('Preencha seu nome e senha simbólica!');
      return;
    }

    if (!linguagem) {
      alert('Selecione uma linguagem para votar!');
      return;
    }

    try {
      // Dispara a requisição POST para o seu backend Java
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          nome: nome,
          senha: senha,
          linguagem: linguagem.value
        })
      });

      // Se a resposta for ruim (ex: erro 400 que criamos no Java para voto repetido)
      if (!response.ok) {
        const errorMsg = await response.text();
        alert(errorMsg);
        return;
      }

      // Mostra mensagem de sucesso
      const langNames = { assembly: 'Assembly', cpp: 'C++', pascal: 'Pascal', prolog: 'Prolog' };
      document.getElementById('vote-summary').textContent = nome + ' votou em ' + langNames[linguagem.value];
      document.getElementById('success-msg').classList.remove('hidden');
      document.getElementById('vote-form').classList.add('hidden');

      // Atualiza o gráfico de barras puxando os dados atualizados do banco!
      updateResults();

    } catch (error) {
      alert('Erro ao conectar com o backend. Verifique se a API Java está rodando!');
      console.error(error);
    }
  });

  // Carrega resultados ao abrir a página
  updateResults();
</script>

</body>
</html>
